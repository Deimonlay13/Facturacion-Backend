version: '3.9'

services:
  db:
    image: postgres:15
    container_name: facturacion-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    volumes:
      - db-data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d facturacion"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - app-network

  app:
    container_name: facturacion-app

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/facturacion
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}
      SRE_API_TOKEN: ${SRE_API_TOKEN}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge