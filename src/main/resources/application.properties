spring.application.name=facturacion-backend

server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/facturacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:facturacion_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:facturacion}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}

# API SRE
sre.api.url=https://sre.cl/api/company_info
sre.api.token=${SRE_API_TOKEN}

# Recursos estáticos
spring.web.resources.cache.cachecontrol.no-cache=true