# Configuración de TEST: BD H2 en memoria (no toca Render)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (valores fijos para test)
jwt.secret=TestSecretKeyForJUnit_0123456789_0123456789_0123456789_ABCDEFGH
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# SRE (no se llama en test)
sre.api.url=http://localhost:9999/sre
sre.api.token=test-token
